<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Season 1 – News & Announcements</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at center, #004e92 0%, #000428 60%, #000000 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- NAVBAR (same as other pages) ---------- */
    nav {
      width: 100%;
      background: #000000;
      border-bottom: 2px solid #fdd835;
    }

    .nav-inner {
      max-width: 1150px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #fdd835;
      object-fit: cover;
    }

    .brand-lines {
      line-height: 1.2;
    }

    .brand-line-1 {
      font-size: 11px;
      font-weight: 700;
      color: #6fffe9;
      letter-spacing: 1px;
    }

    .brand-line-2 {
      font-size: 20px;
      font-weight: 900;
      color: #ffd700;
    }

    .brand-line-3 {
      font-size: 11px;
      font-weight: 600;
      color: #ff66cc;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .menu a {
      color: #ffd700;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      transition: 0.2s;
    }

    .menu a:hover {
      color: #000;
      background: #ffd700;
    }

    .menu a.active {
      background: #ffd700;
      color: #000;
    }

    /* ---------- HERO CARD ---------- */
    .hero-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px 30px;
    }

    .hero-card {
      width: 100%;
      max-width: 900px;
      background: radial-gradient(circle at top, #063a75 0%, #021425 55%, #000814 100%);
      border-radius: 32px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      padding: 24px 20px 26px;
    }

    .hero-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin: 4px 0 6px;
    }

    .hero-title span {
      color: #ffd700;
    }

    .hero-subtitle {
      text-align: center;
      font-size: 13px;
      color: #e0e0e0;
      max-width: 650px;
      margin: 0 auto 18px;
    }

    .news-item {
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .news-title {
      font-weight: 700;
      color: #ffd700;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .news-date {
      font-size: 11px;
      color: #b0bec5;
      margin-bottom: 6px;
    }

    .news-body {
      font-size: 13px;
      color: #ffffff;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #cfd8dc;
      padding: 8px 0 12px;
    }

    @media (max-width: 680px) {
      .nav-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .menu {
        justify-content: flex-start;
      }
      .hero-card {
        padding: 20px 14px 22px;
      }
      .hero-title {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-inner">
      <div class="brand">
        <img src="/images/logo.png" class="brand-logo" alt="MPL Logo" />
        <div class="brand-lines">
        </div>
      </div>

      <div class="menu">
        <a href="/index.html">Home</a>
        <a href="/approved.html">Approved</a>
        <a href="/news.html" class="active">News</a>
        <a href="/schedule.html">Schedule</a>
        <a href="/teams.html">Teams</a>
        <a href="/admin.html">Admin</a>
      </div>
    </div>
  </nav>

  <!-- HERO CARD -->
  <div class="hero-wrapper">
    <div class="hero-card">
      <div class="hero-title">🗞️ <span>UPL 2026 – Tournament News</span></div>
      <p class="hero-subtitle">
        Latest announcements, registration updates and important information for all UPL Season1 players and team owners.
      </p>
