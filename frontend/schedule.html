      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }

    h2, h3 {
      color: #ffd700;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.95em;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      text-align: left;
    }

    th {
      background: rgba(0,0,0,0.8);
      color: #ffd700;
    }

    tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }

    footer {
      margin-top: auto;
      padding: 15px 0;
      font-size: 0.9em;
      color: #ddd;
      opacity: 0.9;
    }
