<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPL Season 3 – Teams</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at center, #004e92 0%, #000428 60%, #000000 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    nav {
      width: 100%;
      background: #000000;
      border-bottom: 2px solid #fdd835;
    }

    .nav-inner {
      max-width: 1150px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #fdd835;
      object-fit: cover;
    }

    .brand-lines {
      line-height: 1.2;
    }

    .brand-line-1 {
      font-size: 11px;
      font-weight: 700;
      color: #6fffe9;
      letter-spacing: 1px;
    }

    .brand-line-2 {
      font-size: 20px;
      font-weight: 900;
      color: #ffd700;
    }

    .brand-line-3 {
      font-size: 11px;
      font-weight: 600;
      color: #ff66cc;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .menu a {
      color: #ffd700;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      transition: 0.2s;
    }

    .menu a:hover,
    .menu a.active {
      color: #000;
      background: #ffd700;
    }

    /* HERO */
    .hero-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .hero-card {
      width: 100%;
      max-width: 950px;
      background: radial-gradient(circle at top, #063a75 0%, #021425 55%, #000814 100%);
      border-radius: 32px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      padding: 24px 20px 26px;
    }

    .hero-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin: 4px 0 6px;
    }

    .hero-title span {
      color: #ffd700;
    }

    .hero-subtitle {
      text-align: center;
      font-size: 13px;
      color: #e0e0e0;
      max-width: 650px;
      margin: 0 auto 22px;
    }

    /* TEAMS GRID */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 26px;
    }

    .team-card {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 20px;
      padding: 18px 14px;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .team-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 22px rgba(255, 215, 0, 0.35);
    }

    .team-card img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .team-card h3 {
      font-size: 14px;
      font-weight: 800;
      color: #ffd700;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .info-box {
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.45);
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: #cfd8dc;
      padding: 8px 0 12px;
    }
  </style>
</head>

<body>
